name: MSE Telegram Bot Daily Run

on:
  schedule:
    # Зөвхөн ажлын өдрүүдэд (Даваа - Баасан) UTC 08:15 буюу Монголын 16:15 цагт ажиллана.
    - cron: '15 8 * * 1-5'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4 # v3 -> v4 руу шинэчлэв

    - name: Set up Python
      uses: actions/setup-python@v5 # v4 -> v5 рүү шинэчлэв
      with:
        python-version: '3.10'
        cache: 'pip' # Package-уудыг cache хийж дараагийн удаа хурдан татна

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps

    - name: Run Telegram Bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHANNEL: ${{ secrets.CHANNEL }}
      run: python bot.py
