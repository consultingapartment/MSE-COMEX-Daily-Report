name: MSE Telegram Bot Daily Run

on:
  schedule:
    # Зөвхөн ажлын өдрүүдэд (Даваа - Баасан) UTC 08:15 буюу Монголын 16:15 цагт ажиллана.
    - cron: '15 8 * * 1-5'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Амралтын өдөр эсвэл өмнөх өдрийн мэдээг хүчээр илгээх (true/false)'
        required: false
        default: 'false'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: python bot.py
